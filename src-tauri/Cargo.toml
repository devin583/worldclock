[package]
name = "worldclock"
version = "0.4.0"
edition = "2021"

[lib]
name = "worldclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "worldclock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
