<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldClock</title>
  <link rel="stylesheet" href="style.css?v=silhouette1" />
</head>
<body class="theme-minimal-glass clock-count-2">
  <div id="stage">
    <section id="clock-body" aria-label="WorldClock clock body">
      <div id="object-shell">
        <div id="progress-ring" aria-hidden="true"></div>

        <div id="main">
          <div class="clock-card" id="card-1" data-hit-region data-hit-radius="42" data-hit-pad="34">
            <div class="city-label" id="label-1">Budapest</div>
            <div class="digital-time" id="digital-1">00:00:00</div>
            <div class="digital-date" id="date-1">Mon, 01 Jan</div>

            <svg class="analog-clock" id="analog-1" viewBox="0 0 200 200">
              <circle class="clock-face" cx="100" cy="100" r="95"/>
              <g id="ticks-1"></g>
              <line class="hand hour-hand" id="hour-1" x1="100" y1="100" x2="100" y2="45"/>
              <line class="hand minute-hand" id="minute-1" x1="100" y1="100" x2="100" y2="30"/>
              <line class="hand second-hand" id="second-1" x1="100" y1="110" x2="100" y2="20"/>
              <circle class="center-dot" cx="100" cy="100" r="4"/>
            </svg>

            <div class="offset-label" id="offset-1"></div>
          </div>

          <div class="clock-card" id="card-2" data-hit-region data-hit-radius="42" data-hit-pad="34">
            <div class="city-label" id="label-2">Beijing</div>
            <div class="digital-time" id="digital-2">00:00:00</div>
            <div class="digital-date" id="date-2">Mon, 01 Jan</div>

            <svg class="analog-clock" id="analog-2" viewBox="0 0 200 200">
              <circle class="clock-face" cx="100" cy="100" r="95"/>
              <g id="ticks-2"></g>
              <line class="hand hour-hand" id="hour-2" x1="100" y1="100" x2="100" y2="45"/>
              <line class="hand minute-hand" id="minute-2" x1="100" y1="100" x2="100" y2="30"/>
              <line class="hand second-hand" id="second-2" x1="100" y1="110" x2="100" y2="20"/>
              <circle class="center-dot" cx="100" cy="100" r="4"/>
            </svg>

            <div class="offset-label" id="offset-2"></div>
          </div>
        </div>

        <div id="pomodoro-status" class="hidden" aria-live="polite"></div>
      </div>

      <div id="hover-controls" class="control-surface" data-hit-region data-hit-radius="18" data-hit-pad="5">
        <button id="btn-settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5.9z"></path>
          </svg>
        </button>
        <button id="btn-lock" title="锁定位置" aria-label="锁定位置">
          <svg class="icon-lock-open" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 7.7-1.4"></path>
          </svg>
          <svg class="icon-lock-closed" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
        </button>
        <button id="btn-ontop" title="始终置顶" aria-label="始终置顶">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l5 5h-3v6l2 3H8l2-3V8H7l5-5z"></path>
            <path d="M12 17v4"></path>
          </svg>
        </button>
        <button id="btn-pomodoro" title="开始/暂停番茄钟" aria-label="开始/暂停番茄钟">
          <span>25</span>
        </button>
        <button id="btn-hide" title="最小化到托盘" aria-label="最小化到托盘">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
          </svg>
        </button>
      </div>

      <div id="mode-bar" class="control-surface" data-hit-region data-hit-radius="14" data-hit-pad="5">
        <button class="mode-btn active" data-mode="digital">数字</button>
        <button class="mode-btn" data-mode="analog">指针</button>
        <button class="mode-btn" data-mode="both">双显</button>
      </div>
    </section>

    <nav id="context-menu" class="floating-surface hidden" data-hit-region data-hit-radius="14" data-hit-pad="8" aria-label="快捷菜单">
      <button data-menu-action="toggle-pomodoro" id="menu-pomodoro">开始番茄钟</button>
      <button data-menu-action="reset-pomodoro">重置番茄钟</button>
      <button data-menu-action="toggle-time-format" id="menu-format">切换 12h</button>
      <button data-menu-action="toggle-lock" id="menu-lock">锁定位置</button>
      <button data-menu-action="toggle-ontop" id="menu-ontop">始终置顶</button>
      <label class="menu-range">
        <span>背景透明度</span>
        <input type="range" id="menu-opacity" min="0.72" max="1" step="0.04" value="0.88" />
      </label>
      <button data-menu-action="open-settings">打开设置</button>
    </nav>

    <div id="settings-panel" class="floating-surface hidden" data-hit-region data-hit-radius="18" data-hit-pad="8">
      <header>
        <h3>设置</h3>
        <button id="btn-close-settings" aria-label="关闭设置">×</button>
      </header>

      <section>
        <label>时钟数量</label>
        <div class="radio-group">
          <label><input type="radio" name="clock-count" value="1" /> 单时钟</label>
          <label><input type="radio" name="clock-count" value="2" checked /> 双时钟</label>
        </div>
      </section>

      <section>
        <label>时钟 1 城市名</label>
        <input type="text" id="set-label-1" value="Budapest" />
        <label>时区</label>
        <input type="text" id="set-tz-1" list="timezone-options" value="Europe/Budapest" />
      </section>

      <section id="clock-2-settings">
        <label>时钟 2 城市名</label>
        <input type="text" id="set-label-2" value="Beijing" />
        <label>时区</label>
        <input type="text" id="set-tz-2" list="timezone-options" value="Asia/Shanghai" />
      </section>

      <datalist id="timezone-options"></datalist>

      <section>
        <label>外观</label>
        <div class="radio-group">
          <label><input type="radio" name="theme" value="minimal-glass" checked /> Minimal Glass</label>
          <label><input type="radio" name="theme" value="mechanical" /> Mechanical</label>
          <label><input type="radio" name="theme" value="soft-companion" /> Soft Companion</label>
          <label><input type="radio" name="theme" value="flip" /> Flip Clock</label>
        </div>
      </section>

      <section>
        <label>时间格式</label>
        <div class="radio-group">
          <label><input type="radio" name="time-format" value="24" checked /> 24h</label>
          <label><input type="radio" name="time-format" value="12" /> 12h</label>
        </div>
      </section>

      <section>
        <label for="set-opacity">背景透明度</label>
        <input type="range" id="set-opacity" min="0.72" max="1" step="0.04" value="0.88" />
      </section>

      <section>
        <label>番茄钟</label>
        <div class="split-inputs">
          <label>专注 <input type="number" id="set-focus-minutes" min="1" max="120" value="25" /></label>
          <label>休息 <input type="number" id="set-break-minutes" min="1" max="60" value="5" /></label>
        </div>
      </section>

      <section>
        <label class="toggle-label">
          <input type="checkbox" id="set-ontop" checked />
          始终置顶
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="set-autostart" />
          开机自启
        </label>
      </section>

      <div class="settings-actions">
        <button id="btn-apply">应用</button>
        <button id="btn-cancel">取消</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('pomodoro-status');
      if (status && event?.message) {
        status.classList.remove('hidden');
        status.textContent = String(event.message).slice(0, 90);
      }
    });

    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('pomodoro-status');
      if (status && event?.reason) {
        status.classList.remove('hidden');
        status.textContent = String(event.reason).slice(0, 90);
      }
    });
  </script>
  <script src="main.js?v=silhouette1"></script>
</body>
</html>
