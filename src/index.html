<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldClock</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Manrope:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="flip-clock.css?v=object-shell-0317" />
  <link rel="stylesheet" href="analog-clock.css?v=object-shell-0317" />
  <link rel="stylesheet" href="world-clock.css?v=object-shell-0317" />
  <link rel="stylesheet" href="style.css?v=object-shell-0317" />
</head>
<body class="theme-classic surface-transparent clock-count-2">
  <div id="stage">
    <section id="clock-body" aria-label="WorldClock clock body">
      <div id="object-shell">
        <div id="progress-ring" aria-hidden="true"></div>

        <div id="main">
          <!-- Web Components inserted by JS -->
        </div>

        <div id="pomodoro-status" class="hidden" aria-live="polite"></div>
      </div>
    </section>

    <nav id="context-menu" class="floating-surface hidden" data-hit-region data-hit-radius="14" data-hit-pad="8" aria-label="快捷菜单">
      <button data-menu-action="toggle-pomodoro" id="menu-pomodoro">开始番茄钟</button>
      <button data-menu-action="reset-pomodoro">重置番茄钟</button>
      <button data-menu-action="toggle-time-format" id="menu-format">切换 12h</button>
      <button data-menu-action="toggle-lock" id="menu-lock">锁定位置</button>
      <button data-menu-action="toggle-ontop" id="menu-ontop">始终置顶</button>
      <button data-menu-action="open-settings">打开设置</button>
    </nav>

    <div id="settings-panel" class="floating-surface hidden" data-hit-region data-hit-radius="18" data-hit-pad="8">
      <header>
        <h3>设置</h3>
        <button id="btn-close-settings" aria-label="关闭设置">×</button>
      </header>

      <section>
        <label>时钟数量</label>
        <div class="radio-group">
          <label><input type="radio" name="clock-count" value="1" /> 单时钟</label>
          <label><input type="radio" name="clock-count" value="2" checked /> 双时钟</label>
        </div>
      </section>

      <section>
        <label>显示模式</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="digital" checked /> 数字</label>
          <label><input type="radio" name="mode" value="analog" /> 指针</label>
          <label><input type="radio" name="mode" value="both" /> 双显</label>
        </div>
      </section>

      <section>
        <label>时钟 1 城市名</label>
        <input type="text" id="set-label-1" value="Budapest" />
        <label>时区</label>
        <input type="text" id="set-tz-1" list="timezone-options" value="Europe/Budapest" />
      </section>

      <section id="clock-2-settings">
        <label>时钟 2 城市名</label>
        <input type="text" id="set-label-2" value="Beijing" />
        <label>时区</label>
        <input type="text" id="set-tz-2" list="timezone-options" value="Asia/Shanghai" />
      </section>

      <datalist id="timezone-options"></datalist>

      <section>
        <label>外观风格</label>
        <div class="radio-group">
          <label><input type="radio" name="theme" value="classic" checked /> Classic 经典黑</label>
          <label><input type="radio" name="theme" value="minimal" /> Minimal 浅色</label>
          <label><input type="radio" name="theme" value="cute" /> Cute 可爱暖色</label>
          <label><input type="radio" name="theme" value="glass" /> Glass 玻璃</label>
        </div>
      </section>

      <section>
        <label>背景样式</label>
        <div class="radio-group">
          <label><input type="radio" name="surface-style" value="transparent" checked /> 透明物件</label>
          <label><input type="radio" name="surface-style" value="solid" /> 局部底色</label>
        </div>
      </section>

      <section>
        <label>时间格式</label>
        <div class="radio-group">
          <label><input type="radio" name="time-format" value="24" checked /> 24h</label>
          <label><input type="radio" name="time-format" value="12" /> 12h</label>
        </div>
      </section>

      <section>
        <label for="set-opacity">局部透明度</label>
        <input type="range" id="set-opacity" min="0.72" max="1" step="0.04" value="0.88" />
      </section>

      <section>
        <label>番茄钟</label>
        <div class="split-inputs">
          <label>专注 <input type="number" id="set-focus-minutes" min="1" max="120" value="25" /></label>
          <label>休息 <input type="number" id="set-break-minutes" min="1" max="60" value="5" /></label>
        </div>
      </section>

      <section>
        <label class="toggle-label">
          <input type="checkbox" id="set-ontop" checked />
          始终置顶
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="set-autostart" />
          开机自启
        </label>
      </section>

      <div class="settings-actions">
        <button id="btn-apply">应用</button>
        <button id="btn-cancel">取消</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('pomodoro-status');
      if (status && event?.message) {
        status.classList.remove('hidden');
        status.textContent = String(event.message).slice(0, 90);
      }
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('pomodoro-status');
      if (status && event?.reason) {
        status.classList.remove('hidden');
        status.textContent = String(event.reason).slice(0, 90);
      }
    });
  </script>
  <script src="tz-util.js"></script>
  <script src="flip-clock.js"></script>
  <script src="analog-clock.js"></script>
  <script src="world-clock.js"></script>
  <script src="main.js?v=object-shell-0317"></script>
</body>
</html>
